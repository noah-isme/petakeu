          pnpm benchmark -- \
            --url="$R4_API_URL" \
            --period="$PETAKEU_E2E_PERIOD" \
            --token="$PETAKEU_OPERATOR_TOKEN" \
            --concurrency=10 \
            --requests=50 \
            --hit-sla=300 \
            --cold-sla=2000 \
            --json 2>&1 | tee "$EVIDENCE_DIR/choropleth-benchmark.json"

      - name: Enforce confirmation release gate
        if: always()
        run: |
          set -euo pipefail
          failed=0
          for outcome in \
            "preflight=${{ steps.preflight.outcome }}" \
            "integration=${{ steps.integration.outcome }}" \
            "integration_skips=${{ steps.integration_skips.outcome }}" \
            "browser=${{ steps.browser.outcome }}" \
            "browser_skips=${{ steps.browser_skips.outcome }}" \
            "security=${{ steps.security.outcome }}" \
            "security_skips=${{ steps.security_skips.outcome }}" \
            "performance=${{ steps.performance.outcome }}"; do
            name="${outcome%%=*}"
            value="${outcome#*=}"
            if [[ "$value" != success ]]; then
              echo "::error title=Confirmation gate failed::$name step outcome: $value"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-confirmation-evidence-${{ github.run_id }}
          path: staging-evidence/confirmation
          if-no-files-found: warn
          retention-days: 90
