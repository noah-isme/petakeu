# Infrastructure for the isolated integration gate. The runner assigns a
# unique Compose project and random host ports, then tears the project and its
# volumes down in a finally block. No developer or staging data is reused.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: petakeu
      POSTGRES_USER: petakeu
      POSTGRES_PASSWORD: petakeu-integration
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petakeu -d petakeu"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
